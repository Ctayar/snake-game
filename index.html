<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        const obstacles = [
        // Top-left "L" shape
        {x: 2, y: 2}, {x: 3, y: 2}, {x: 2, y: 3},
    
        // Top-right "L" shape 
        {x: 17, y: 2}, {x: 16, y: 2}, {x: 17, y: 3},
    
        // Bottom-left "L" shape
        {x: 2, y: 17}, {x: 3, y: 17}, {x: 2, y: 16}
        ];

        let score = 0;
        let snakeColor = "red";
        const availableColors = ["red", "blue", "purple", 
        "yellow", "orange", "green", "pink", 
        "black", "teal", "cyan", "gold"];
        const info = document.getElementById("info");
        info.textContent = "Score: " + score;
        let gameLoopInterval;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );
            ctx.fillStyle = "silver";
            for (const obstacle of obstacles) {
                ctx.fillRect(
                    obstacle.x * gridSize,
                    obstacle.y * gridSize,
                    gridSize, gridSize
                );
            }
            ctx.fillStyle = snakeColor;
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        
        // Step 1: Movement (game loop)
        const gameLoop = () => {
            const tailX = snake[snake.length - 1].x;
            const tailY = snake[snake.length - 1].y;
            for (let i = snake.length - 1; i > 0; i--) {
                snake[i].x = snake[i - 1].x;
                snake[i].y = snake[i - 1].y;
            }
            snake[0].x += direction.x;
            snake[0].y += direction.y;
            for (const obstacle of obstacles) {
                if (snake[0].x === obstacle.x && snake[0].y === obstacle.y) {
                    clearInterval(gameLoopInterval);
                    alert("Game Over! You Hit An Obstacle! Your score is: " + score);
                    location.reload(); // Reload the page to restart the game
                return;
                }
            }
            if (snake[0].x <0 || snake[0].x > tileCount - 1 || snake[0].y < 0 || snake[0].y > tileCount - 1) {
                clearInterval(gameLoopInterval);
                alert("Game Over! You Hit A Wall! Your score is: " + score);
                location.reload(); // Reload the page to restart the game
                return;
            }
            for (let i = 1; i < snake.length; i++) { 
                // Step 4: Game over
                if (snake[0].x === snake[i].x && snake[0].y === snake[i].y) {
                    clearInterval(gameLoopInterval);
                    alert("Game Over! You Ate Yourself! Your score: " + score);
                    location.reload(); // Reload the page to restart the game
                    return;

                }

            }
            // Step 3: Eating and growing
            if (snake[0].x === food.x && snake[0].y === food.y){
                score++;
                snakeColor = availableColors[Math.floor(Math.random() * availableColors.length)];
                info.textContent = "Score: " + score;
                snake.push({ x: tailX, y: tailY });
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
                // Ensure food does not spawn on the snake or obstacles
                while (snake.some(segment => segment.x === food.x && segment.y === food.y)
                    || obstacles.some(obstacles => obstacles.x === food.x && 
                obstacles.y === food.y)) {
                    food.x = Math.floor(Math.random() * tileCount);
                    food.y = Math.floor(Math.random() * tileCount);
                }
            }
            drawGame();
        };
        gameLoopInterval = setInterval(gameLoop, 200);
        // Step 2: Keyboard controls (arrow keys)
        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowUp" && direction.y === 0) {
                direction = { x: 0, y: -1 };
            } else if (event.key === "ArrowDown" && direction.y === 0) {
                direction = { x: 0, y: 1 };
            } else if (event.key === "ArrowLeft" && direction.x === 0) {
                direction = { x: -1, y: 0 };
            } else if (event.key === "ArrowRight" && direction.x === 0) {
                direction = { x: 1, y: 0 };
            }
        });
        
        
        
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
